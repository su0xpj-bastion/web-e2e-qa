name: ci
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - name: functional + cross-browser + responsive + a11y + devtools (6 projects)
        run: npx playwright test --project=chromium-desktop --project=firefox-desktop --project=webkit-desktop --project=mobile-chrome --project=mobile-safari --project=tablet
      - name: visual regression (Linux baselines)
        run: npx playwright test --project=visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
  fault-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: every injected UI fault is caught by exactly its tests
        run: node scripts/fault-matrix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-matrix
          path: test-results/fault-matrix.md
